<svg width="420" height="480" viewBox="0 0 420 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three types of triangles and their symmetry">
  <defs>
    <linearGradient id="bg-tri-sym" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="420" height="480" rx="32" fill="url(#bg-tri-sym)" />
  
  <!-- Equilateral triangle with 3 symmetry lines -->
  <g transform="translate(105,100)">
    <polygon points="0,-60 -69,30 69,30" fill="#10b981" stroke="#047857" stroke-width="3" />
    <line x1="0" y1="-70" x2="0" y2="35" stroke="#16a34a" stroke-width="3" stroke-dasharray="6,6" />
    <line x1="-75" y1="35" x2="35" y2="-30" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,6" />
    <line x1="75" y1="35" x2="-35" y2="-30" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,6" />
    <circle cx="55" cy="-55" r="12" fill="#16a34a" stroke="#fff" stroke-width="2" />
    <text x="55" y="-49" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial" fill="#fff"></text>
    <text x="0" y="65" text-anchor="middle" font-size="18" font-weight="700" font-family="Heebo, 'Assistant', Arial" fill="#0f172a">щеед-цмтеъ</text>
    <text x="0" y="85" text-anchor="middle" font-size="16" font-weight="700" font-family="Heebo, 'Assistant', Arial" fill="#16a34a">3 чеей сйоишйд</text>
  </g>
  
  <!-- Isosceles triangle with 1 symmetry line -->
  <g transform="translate(315,100)">
    <polygon points="0,-60 -50,30 50,30" fill="#3b82f6" stroke="#1e40af" stroke-width="3" />
    <line x1="0" y1="-70" x2="0" y2="35" stroke="#16a34a" stroke-width="3" stroke-dasharray="6,6" />
    <circle cx="55" cy="-55" r="12" fill="#16a34a" stroke="#fff" stroke-width="2" />
    <text x="55" y="-49" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial" fill="#fff"></text>
    <text x="0" y="65" text-anchor="middle" font-size="18" font-weight="700" font-family="Heebo, 'Assistant', Arial" fill="#0f172a">щеед-щечййн</text>
    <text x="0" y="85" text-anchor="middle" font-size="16" font-weight="700" font-family="Heebo, 'Assistant', Arial" fill="#16a34a">че сйоишйд азг</text>
  </g>
  
  <!-- Scalene triangle with NO symmetry -->
  <g transform="translate(210,310)">
    <polygon points="-40,-40 -70,50 50,40" fill="#ef4444" stroke="#991b1b" stroke-width="3" />
    <!-- Attempted symmetry lines with X marks -->
    <line x1="-10" y1="-50" x2="-10" y2="55" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,4" opacity="0.5" />
    <g transform="translate(-10,-10)">
      <line x1="-8" y1="-8" x2="8" y2="8" stroke="#dc2626" stroke-width="4" />
      <line x1="-8" y1="8" x2="8" y2="-8" stroke="#dc2626" stroke-width="4" />
    </g>
    <circle cx="60" cy="-45" r="12" fill="#dc2626" stroke="#fff" stroke-width="2" />
    <text x="60" y="-39" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial" fill="#fff"></text>
    <text x="0" y="80" text-anchor="middle" font-size="18" font-weight="700" font-family="Heebo, 'Assistant', Arial" fill="#0f172a">ощемщ лмщде</text>
    <text x="0" y="100" text-anchor="middle" font-size="16" font-weight="700" font-family="Heebo, 'Assistant', Arial" fill="#dc2626">ма сйоишй!</text>
  </g>
  
  <text x="210" y="460" text-anchor="middle" font-size="24" font-weight="700" font-family="Heebo, 'Assistant', Arial" fill="#0f172a">ма лм дощемщйн сйоишййн</text>
</svg>
