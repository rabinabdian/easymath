<svg width="420" height="320" viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Half star for symmetry exercise">
  <defs>
    <linearGradient id="bg-halfstar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="star-half" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="420" height="320" rx="32" fill="url(#bg-halfstar)" />
  
  <!-- Symmetry line -->
  <line x1="210" y1="30" x2="210" y2="290" stroke="#0f172a" stroke-width="4" stroke-dasharray="8,8" />
  
  <!-- Half star (left side) -->
  <g transform="translate(210,160)">
    <path d="M 0,-70 L -20,-20 L -70,-20 L -30,10 L -45,60 L 0,30 Z" 
          fill="url(#star-half)" stroke="#d97706" stroke-width="3" />
  </g>
  
  <!-- Dotted outline of missing half -->
  <g transform="translate(210,160)">
    <path d="M 0,-70 L 20,-20 L 70,-20 L 30,10 L 45,60 L 0,30 Z" 
          fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" />
  </g>
  
  <text x="105" y="290" text-anchor="middle" font-size="20" font-weight="700" font-family="Heebo, 'Assistant', Arial" fill="#0f172a">зцй ома</text>
  <text x="315" y="290" text-anchor="middle" font-size="20" font-weight="700" font-family="Heebo, 'Assistant', Arial" fill="#64748b">зцй зсш</text>
  <text x="210" y="30" text-anchor="middle" font-size="24" font-weight="700" font-family="Heebo, 'Assistant', Arial" fill="#0f172a">че щйчеу</text>
</svg>
