<svg width="420" height="420" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dreidel with two symmetry lines">
  <defs>
    <linearGradient id="bg-dreidel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#bfdbfe" />
    </linearGradient>
    <linearGradient id="dreidel-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="420" height="420" rx="32" fill="url(#bg-dreidel)" />
  
  <g transform="translate(210,210)">
    <!-- Dreidel body (diamond shape for simplicity) -->
    <polygon points="0,-80 60,0 0,80 -60,0" fill="url(#dreidel-fill)" stroke="#1e40af" stroke-width="4" />
    
    <!-- Handle on top -->
    <rect x="-8" y="-110" width="16" height="30" rx="8" fill="url(#dreidel-fill)" stroke="#1e40af" stroke-width="3" />
    
    <!-- Tip at bottom -->
    <polygon points="0,80 -10,95 10,95" fill="url(#dreidel-fill)" stroke="#1e40af" stroke-width="3" />
    
    <!-- Hebrew letter р (Nun) in center -->
    <text x="0" y="10" text-anchor="middle" font-size="48" font-weight="700" font-family="Arial" fill="#1e3a8a">р</text>
    
    <!-- First symmetry line (vertical) -->
    <line x1="0" y1="-130" x2="0" y2="120" stroke="#16a34a" stroke-width="4" stroke-dasharray="8,8" />
    
    <!-- Second symmetry line (horizontal) -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#dc2626" stroke-width="4" stroke-dasharray="8,8" />
    
    <!-- Labels -->
    <text x="-95" y="-90" font-size="20" font-weight="700" font-family="Heebo, 'Assistant', Arial" fill="#16a34a">че 1</text>
    <text x="70" y="-20" font-size="20" font-weight="700" font-family="Heebo, 'Assistant', Arial" fill="#dc2626">че 2</text>
  </g>
  
  <text x="210" y="390" text-anchor="middle" font-size="26" font-weight="700" font-family="Heebo, 'Assistant', Arial" fill="#0f172a">сбйбеп тн щрй чеей щйчеу</text>
</svg>
