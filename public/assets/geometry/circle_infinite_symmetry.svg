<svg width="420" height="420" viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Circle with infinite symmetry lines">
  <defs>
    <linearGradient id="bg-circle-inf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="circle-inf-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="420" height="420" rx="32" fill="url(#bg-circle-inf)" />
  
  <g transform="translate(210,210)">
    <!-- Circle -->
    <circle cx="0" cy="0" r="110" fill="url(#circle-inf-fill)" stroke="#d97706" stroke-width="5" />
    
    <!-- Multiple symmetry lines at different angles -->
    <!-- Vertical -->
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#16a34a" stroke-width="3" stroke-dasharray="8,8" />
    
    <!-- Horizontal -->
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#dc2626" stroke-width="3" stroke-dasharray="8,8" />
    
    <!-- Diagonal 1 -->
    <line x1="-92" y1="-92" x2="92" y2="92" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8,8" />
    
    <!-- Diagonal 2 -->
    <line x1="-92" y1="92" x2="92" y2="-92" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="8,8" />
    
    <!-- 30 degrees -->
    <line x1="-112" y1="-65" x2="112" y2="65" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,6" />
    
    <!-- 60 degrees -->
    <line x1="-65" y1="-112" x2="65" y2="112" stroke="#ec4899" stroke-width="2" stroke-dasharray="6,6" />
    
    <!-- 150 degrees -->
    <line x1="-65" y1="112" x2="65" y2="-112" stroke="#10b981" stroke-width="2" stroke-dasharray="6,6" />
    
    <!-- 120 degrees -->
    <line x1="-112" y1="65" x2="112" y2="-65" stroke="#f97316" stroke-width="2" stroke-dasharray="6,6" />
    
    <!-- Center dot -->
    <circle cx="0" cy="0" r="5" fill="#0f172a" />
    
    <!-- "..." to indicate more lines -->
    <text x="80" y="80" font-size="36" font-weight="700" fill="#64748b">...</text>
    <text x="-100" y="80" font-size="36" font-weight="700" fill="#64748b">...</text>
    <text x="80" y="-70" font-size="36" font-weight="700" fill="#64748b">...</text>
    <text x="-100" y="-70" font-size="36" font-weight="700" fill="#64748b">...</text>
  </g>
  
  <text x="210" y="385" text-anchor="middle" font-size="26" font-weight="700" font-family="Heebo, 'Assistant', Arial" fill="#0f172a">мотвм айрсеу чеей сйоишйд!</text>
</svg>
