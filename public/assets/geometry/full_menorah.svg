      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="420" height="380" rx="32" fill="url(#bg-full-menorah)" />
  
  <!-- Symmetry line -->
